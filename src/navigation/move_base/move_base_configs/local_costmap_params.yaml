local_costmap:
  global_frame: map
  robot_base_frame: body
  update_frequency: 4.0
  publish_frequency: 3.0
  transform_tolerance: 1.0

  static_map: false
  rolling_window: true
  width: 4.0
  height: 4.0
  resolution: 0.05

  plugins:
  - {name: obstacle_laser_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  
  inflation_layer:
    enabled: true
    cost_scaling_factor: 2.58
    inflation_radius: 0.5
    track_unknown_space: true

  obstacle_laser_layer:
    track_unknown_space: true
    observation_sources: spot sonar_front sonar_rear
    footprint_clearing_enabled: true
    spot: {data_type: LaserScan, sensor_frame: velodyne_base_link, clearing: true, marking: true, topic: /scan}
    sonar_front: {sensor_frame: sonar_front, data_type: LaserScan, topic: /laser_front, marking: true, clearing: true, raytrace_range : 1.5, obstacle_range: 1.0, inf_is_valid: True} 
    sonar_rear: {sensor_frame: sonar_rear, data_type: LaserScan, topic: /laser_rear, marking: true, clearing: true, raytrace_range : 2.0, obstacle_range: 1.9, inf_is_valid: True} 
    
