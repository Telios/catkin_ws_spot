base_local_planner: base_local_planner/TrajectoryPlannerROS

TrajectoryPlannerROS:
  max_vel_x: 0.9
  min_vel_x: 0.2
  max_vel_theta: 0.7
  min_in_place_vel_theta: 0.7
  escape_vel: -0.2
  y_vels: "-0.3,-0.2,0.2,0.3"

  acc_lim_theta: 0.9
  acc_lim_x: 2.5
  acc_lim_y: 2.5

  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.15

  path_distance_bias: 5
  goal_distance_bias: 5
  occdist_scale: 0.02

  holonomic_robot: true
  meter_scoring: true
  sim_time: 2.0
  sim_granularity: 0.25
  angular_sim_granularity: 0.15
  dwa: false